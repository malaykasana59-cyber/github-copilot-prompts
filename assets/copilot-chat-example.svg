<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">Illustrated GitHub Copilot Chat usage example</title>
  <desc id="desc">A dark VS Code window showing the route-task prompt and a Copilot response selecting a code reviewer.</desc>
  <rect width="960" height="460" rx="14" fill="#17191f"/>
  <rect x="0" y="0" width="960" height="42" rx="14" fill="#242832"/>
  <circle cx="24" cy="21" r="6" fill="#ff6b6b"/><circle cx="44" cy="21" r="6" fill="#ffd166"/><circle cx="64" cy="21" r="6" fill="#06d6a0"/>
  <text x="92" y="26" fill="#c9d1d9" font-family="sans-serif" font-size="15">VS Code  |  Copilot Chat</text>
  <rect x="24" y="70" width="548" height="330" rx="8" fill="#20242c"/>
  <text x="48" y="105" fill="#8b949e" font-family="sans-serif" font-size="14">COPILOT CHAT</text>
  <text x="48" y="148" fill="#f0f6fc" font-family="sans-serif" font-size="20">/route-task</text>
  <text x="48" y="180" fill="#c9d1d9" font-family="sans-serif" font-size="16">Review the authentication changes</text>
  <text x="48" y="204" fill="#c9d1d9" font-family="sans-serif" font-size="16">in this pull request.</text>
  <line x1="48" y1="232" x2="520" y2="232" stroke="#3b424e"/>
  <text x="48" y="268" fill="#7ee787" font-family="sans-serif" font-size="15">Copilot</text>
  <text x="48" y="298" fill="#f0f6fc" font-family="sans-serif" font-size="16">Primary: @security-reviewer</text>
  <text x="48" y="326" fill="#c9d1d9" font-family="sans-serif" font-size="15">I found an auth-sensitive change,</text>
  <text x="48" y="350" fill="#c9d1d9" font-family="sans-serif" font-size="15">so security review is the best fit.</text>
  <rect x="616" y="70" width="312" height="330" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="644" y="112" fill="#58a6ff" font-family="sans-serif" font-size="18">Why this library?</text>
  <text x="644" y="154" fill="#f0f6fc" font-family="sans-serif" font-size="16">63 agents</text>
  <text x="644" y="184" fill="#f0f6fc" font-family="sans-serif" font-size="16">40 prompts</text>
  <text x="644" y="214" fill="#f0f6fc" font-family="sans-serif" font-size="16">46 skills</text>
  <text x="644" y="244" fill="#f0f6fc" font-family="sans-serif" font-size="16">84 instructions</text>
  <text x="644" y="304" fill="#8b949e" font-family="sans-serif" font-size="14">Copy into .github</text>
  <text x="644" y="328" fill="#8b949e" font-family="sans-serif" font-size="14">and start chatting.</text>
</svg>